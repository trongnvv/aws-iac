# Karpenter controller (OCI chart). AWS-side IAM/SQS come from
# layer0/03-karpenter-infra; the NodePool/EC2NodeClass are applied post-sync.
releases:
  - name: karpenter
    namespace: kube-system
    chart: oci://public.ecr.aws/karpenter/karpenter
    version: "1.1.1"
    wait: true
    values:
      - values/values.yaml.gotmpl
    hooks:
      - events: ["postsync"]
        showlogs: true
        command: bash
        args:
          - -c
          - sed "s|__CLUSTER__|$CLUSTER_NAME|g; s|__NODEROLE__|$KARPENTER_NODE_ROLE|g" nodepool.yaml | kubectl apply -f -
