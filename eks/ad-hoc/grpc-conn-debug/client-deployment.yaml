apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-client
  labels:
    app.kubernetes.io/name: grpc-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grpc-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grpc-client
    spec:
      containers:
        - name: client
          image: grpc-client # rewritten by kustomize (CI sets the tag)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # === CASE 1 (DEFAULT the app ships) ===
            # ClusterIP + pick_first, no mesh -> single pinned backend.
            # Other cases (see README "4 cases of gRPC LB"):
            #   Case 2: SERVER_ADDR=dns:///grpc-server-headless.grpc-debug.svc.cluster.local:50051, LB_POLICY=pick_first
            #   Case 3: (headless, as above) + LB_POLICY=round_robin
            #   Case 4: keep these Case-1 values, put it behind a service mesh
            #           (Kuma, layer2/06) so an L7 proxy load-balances per-RPC
            - name: SERVER_ADDR
              value: "grpc-server.grpc-debug.svc.cluster.local:50051"
              # value: "grpc-server-headless.grpc-debug.svc.cluster.local:50051"
            - name: LB_POLICY
              # value: "pick_first"
              value: "round_robin"
            - name: HTTP_ADDR
              value: ":8080"
            # REST drives the calls now; flip to "true" to also run the background loop.
            - name: LOOP
              value: "false"
            - name: INTERVAL
              value: "3s"
            # - name: GRPC_GO_LOG_SEVERITY_LEVEL
            #   value: "info"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532 # distroless :nonroot uid — numeric so kubelet can verify non-root
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
