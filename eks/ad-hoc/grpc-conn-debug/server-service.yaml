# Normal ClusterIP Service — one virtual IP. kube-proxy load-balances the VIP at L4
# (per-connection), but gRPC opens ONE long-lived HTTP/2 connection, so with the
# client on pick_first every RPC pins to the single backend chosen at connect time
# (the classic gRPC-on-L4-LB behaviour to observe here). Same result on any L4
# dataplane — kube-proxy iptables/IPVS on EKS, like eBPF LBs elsewhere.
apiVersion: v1
kind: Service
metadata:
  name: grpc-server
  labels:
    app.kubernetes.io/name: grpc-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grpc-server
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: grpc
---
# Headless Service — DNS returns every pod IP. Point the client at this with
# LB_POLICY=round_robin to see it open a connection PER pod and spread RPCs.
apiVersion: v1
kind: Service
metadata:
  name: grpc-server-headless
  labels:
    app.kubernetes.io/name: grpc-server
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: grpc-server
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: grpc
