# External entry for the client REST API via an ALB (AWS Load Balancer Controller).
# The gRPC *server* stays in-cluster on purpose — the whole lab is about IN-CLUSTER
# gRPC load-balancing (ClusterIP pin vs headless round-robin). Drive the server from
# outside through the client's /call, /bench, /stream endpoints, or hit it directly
# with `grpcurl` from inside a pod / via `kubectl port-forward`.
#
# Replace example.com with your real Route 53 domain (foundation/01-dns var.domain);
# external-dns creates the record when the host matches DOMAIN_FILTER.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grpc-client
  namespace: grpc-debug
  labels:
    app.kubernetes.io/name: grpc-client
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # ALB → pod IP directly (VPC CNI)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # For HTTPS: swap listen-ports to '[{"HTTPS":443}]' and add an ACM cert:
    #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:<acct>:certificate/<id>
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: grpc-client-lab-01.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grpc-client
                port:
                  number: 80
