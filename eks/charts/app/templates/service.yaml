{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name | default (include "app.name" $) }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  type: {{ .type | default "ClusterIP" }}
  {{- if .clusterIP }}
  clusterIP: {{ .clusterIP }}
  {{- end }}
  selector:
    {{- include "app.selectorLabels" $ | nindent 4 }}
  ports:
    {{- if .ports }}
    {{- toYaml .ports | nindent 4 }}
    {{- else }}
    - name: {{ $.Values.port.name }}
      port: {{ include "app.servicePort" $ }}
      targetPort: {{ $.Values.port.name }}
      {{- with $.Values.port.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
