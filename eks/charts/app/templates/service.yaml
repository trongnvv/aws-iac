{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name | default (include "app.name" $) }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  type: {{ .type | default "ClusterIP" }}
  {{- if .clusterIP }}
  clusterIP: {{ .clusterIP }}
  {{- end }}
  selector:
    {{- include "app.selectorLabels" $ | nindent 4 }}
  ports:
    {{- toYaml .ports | nindent 4 }}
{{- end }}
