{{- if .Values.grpcRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- with .Values.grpcRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.grpcRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.grpcRoute.rules }}
    {{- toYaml .Values.grpcRoute.rules | nindent 4 }}
    {{- else }}
    - backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ .Values.grpcRoute.servicePort | default (include "app.servicePort" .) }}
    {{- end }}
{{- end }}
