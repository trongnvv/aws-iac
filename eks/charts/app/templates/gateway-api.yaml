{{- /* All Gateway API resources for this release in one file: Gateway, HTTPRoute, GRPCRoute,
       and the LBC TargetGroupConfiguration (target-group settings). Each is gated by its own
       `enabled` flag. GatewayClass + LoadBalancerConfiguration are cluster/shared infra and
       live outside the chart (raw customValues). */ -}}

{{- if .Values.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  {{- with .Values.gateway.infrastructure }}
  infrastructure:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
{{- end }}

{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.httpRoute.rules }}
    {{- toYaml .Values.httpRoute.rules | nindent 4 }}
    {{- else }}
    - backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ .Values.httpRoute.servicePort | default (include "app.servicePort" .) }}
    {{- end }}
{{- end }}

{{- if .Values.grpcRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- with .Values.grpcRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.grpcRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.grpcRoute.rules }}
    {{- toYaml .Values.grpcRoute.rules | nindent 4 }}
    {{- else }}
    - backendRefs:
        - name: {{ include "app.name" . }}
          port: {{ .Values.grpcRoute.servicePort | default (include "app.servicePort" .) }}
    {{- end }}
{{- end }}

{{- if .Values.targetGroupConfiguration.enabled }}
---
# ALB target-group settings for a Service used by a Gateway route. Gateway API defaults to
# `instance` targets (NodePort/LB Service); set targetType=ip for ClusterIP + pod-IP targets.
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetReference:
    group: ""
    kind: Service
    name: {{ .Values.targetGroupConfiguration.serviceName | default (include "app.name" .) }}
  defaultConfiguration:
    targetType: {{ .Values.targetGroupConfiguration.targetType }}
    {{- with .Values.targetGroupConfiguration.protocolVersion }}
    protocolVersion: {{ . }}
    {{- end }}
{{- end }}
