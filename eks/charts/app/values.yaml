# ---- workload (Deployment) ----
# The Deployment renders only when `image` is set; leave empty to use the chart purely
# for services / raw customValues (e.g. CRs).
nameOverride: ""          # defaults to the release name; drives labels + selectors
image: ""                 # full ref, e.g. "<acct>.dkr.ecr.<region>.amazonaws.com/app:v1"
imagePullPolicy: IfNotPresent
replicas: 1
command: []
args: []
env: []                   # raw env list (name/value or valueFrom)
labels: {}                # extra labels merged onto every object

# ---- primary port — single source of truth ----
# Flows to: the container port, the default Service port, the auto health probes, and
# the default Ingress / HTTPRoute / GRPCRoute backend port. Override any of them in place.
port:
  name: http              # port name referenced everywhere
  number: 8080            # containerPort
  appProtocol: ""         # "grpc" -> gRPC probe + Service appProtocol; else HTTP probe
  servicePort: 0          # Service port; 0 => same as `number`
  healthPath: /healthz    # HTTP readiness/liveness path (ignored when appProtocol=grpc)

containerPorts: []        # extra container ports beyond `port` (advanced)

# ---- probes: empty => auto-derived from `port` (grpc vs http). Set to override. ----
readinessProbe: {}
livenessProbe: {}

# ---- sane defaults (override per release) ----
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext: {}
nodeSelector: {}          # e.g. {kubernetes.io/arch: amd64} to pin off an arm64 MNG
affinity: {}
tolerations: []
securityContext:
  runAsNonRoot: true
  runAsUser: 65532        # distroless :nonroot uid — numeric so kubelet can verify non-root
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ---- services (a list; each port defaults from `port` when `ports` is omitted) ----
services: []
# - name: ""              # defaults to app name
#   type: ClusterIP
#   clusterIP: ""         # "None" for a headless Service
#   ports: []             # omit => one port derived from `port`

# ---- ingress (ALB / nginx / ...) ----
ingress:
  enabled: false
  className: alb
  annotations: {}
  rules: []
  # - host: ""            # optional; omit to match any host (reach via LB DNS)
  #   paths:
  #     - path: /
  #       pathType: Prefix
  #       serviceName: ""  # defaults to app name
  #       servicePort: 0   # 0 => from `port`

# ---- Gateway API Gateway ----
gateway:
  enabled: false
  gatewayClassName: alb   # LBC ALB Gateway API (GatewayClass controllerName gateway.k8s.aws/alb)
  annotations: {}
  infrastructure: {}      # e.g. {parametersRef: {group: gateway.k8s.aws, kind: LoadBalancerConfiguration, name: ...}}
  listeners: []           # raw listeners list

# ---- Gateway API HTTPRoute ----
httpRoute:
  enabled: false
  parentRefs: []          # [{name, namespace?, sectionName?}]
  hostnames: []
  servicePort: 0          # 0 => from `port`
  rules: []               # raw rules; overrides the default backendRef rule

# ---- Gateway API GRPCRoute ----
grpcRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  servicePort: 0          # 0 => from `port`
  rules: []

# ---- LBC TargetGroupConfiguration (Gateway API target-group settings, per Service) ----
targetGroupConfiguration:
  enabled: false
  serviceName: ""         # defaults to app name
  targetType: ip          # pod IPs (ClusterIP ok); Gateway API default is `instance` (needs NodePort/LB)
  protocolVersion: ""     # e.g. GRPC for gRPC backends

# ---- raw passthrough: arbitrary manifests rendered as-is (CRs the fields don't cover) ----
customValues: []
