# Argo CD Image Updater — polls ECR for new image tags and writes them back to the gitops
# repo (git mode). Installed after 00-argocd (same namespace, reads Argo CD Applications).
repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: argocd-image-updater
    namespace: argocd
    chart: argo/argocd-image-updater
    version: "1.3.1" # ships app v1.x → ImageUpdater CRD (config via CR, not Application annotations)
    wait: true
    values:
      - values.yaml

  # ECR pull secret (dockerconfigjson) for Image Updater, minted + refreshed by External Secrets.
  # Needs the ESO CRDs (01-addons/05-external-secrets) — applied in an earlier layer.
  - name: image-updater-ecr-secret
    namespace: argocd
    chart: ../../../../charts/app
    needs:
      - argocd/argocd-image-updater
    values:
      - ecr-imageupdater-externalsecret.yaml
