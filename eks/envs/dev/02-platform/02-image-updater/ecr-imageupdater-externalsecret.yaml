# Rendered via charts/app (raw). Produces a dockerconfigjson secret `ecr-imageupdater` from a fresh
# ECR token — External Secrets Operator mints it with the ESO controller's Pod Identity and refreshes
# before the 12h expiry. Image Updater reads it via `credentials: pullsecret:argocd/ecr-imageupdater`
# (it has no native ECR source). The token is used under ESO's identity, so the ESO role needs ECR
# read on the app repos (grpc-conn-debug/*, hello-express) — see modules/addon-iam/3-eso.tf.
# Requires the External Secrets CRDs (01-addons/05-external-secrets).
customValues:
  # Generator: fetch an ECR auth token (username=AWS, password=<token>) via the controller identity.
  - apiVersion: generators.external-secrets.io/v1alpha1
    kind: ECRAuthorizationToken
    metadata:
      name: ecr-token-imageupdater
      namespace: argocd
    spec:
      region: ap-southeast-1
  # ExternalSecret: build a dockerconfigjson secret from the generator output; auto-refresh.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: ecr-imageupdater
      namespace: argocd
    spec:
      refreshInterval: 10h
      target:
        name: ecr-imageupdater
        template:
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: |
              {"auths":{"391511533175.dkr.ecr.ap-southeast-1.amazonaws.com":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
      dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: ECRAuthorizationToken
              name: ecr-token-imageupdater
