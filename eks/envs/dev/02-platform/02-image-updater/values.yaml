# Controller config. ECR auth with no static creds: `ecr:` uses the pod's Pod Identity
# (role eks-dev-image-updater bound to SA argocd-image-updater, in eks modules/addon-iam).
# Per-app watch config is in ImageUpdater CRs (argo-simple apps/grpc-conn-debug/image-updater.yaml),
# not here. Git write-back reuses the ArgoCD repo-argo-simple credential.
# ⚠️ verify the config schema against chart 1.3.1 (v1.x).
serviceAccount:
  create: true
  name: argocd-image-updater

config:
  registries:
    - name: ECR
      api_url: https://391511533175.dkr.ecr.ap-southeast-1.amazonaws.com
      prefix: 391511533175.dkr.ecr.ap-southeast-1.amazonaws.com
      ping: yes
      credentials: ecr:ap-southeast-1
      credsexpire: 10h
