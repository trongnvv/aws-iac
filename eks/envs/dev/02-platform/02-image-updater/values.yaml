# Controller config. ECR auth with no static creds: Image Updater has no native ECR source, so it
# reads a dockerconfigjson secret (`ecr-imageupdater`) that External Secrets mints + refreshes from
# a fresh ECR token (ecr-imageupdater-externalsecret.yaml). `pullsecret:` points at it.
# Per-app watch config is in ImageUpdater CRs (argo-simple apps/*/image-updater.yaml), not here.
# Git write-back reuses the ArgoCD repo-argo-simple credential.
# ⚠️ verify the config schema against chart 1.3.1 (v1.x).
serviceAccount:
  create: true
  name: argocd-image-updater

config:
  registries:
    - name: ECR
      api_url: https://391511533175.dkr.ecr.ap-southeast-1.amazonaws.com
      prefix: 391511533175.dkr.ecr.ap-southeast-1.amazonaws.com
      ping: yes
      credentials: pullsecret:argocd/ecr-imageupdater
      credsexpire: 10h
