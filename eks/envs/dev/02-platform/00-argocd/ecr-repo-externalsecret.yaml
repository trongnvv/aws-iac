# Rendered via charts/app (raw). Produces the ArgoCD OCI repo secret `repo-ecr-helm` from a
# fresh ECR token — External Secrets Operator mints it with the ESO controller's Pod Identity and
# refreshes before the 12h expiry. The token is used (by ArgoCD) under ESO's identity, so the ESO
# role needs ECR read on helm/* (GetAuthorizationToken + BatchGetImage + ...), see modules/addon-iam/3-eso.tf.
# Requires the External Secrets CRDs (01-addons/05-external-secrets).
customValues:
  # Generator: fetch an ECR auth token (username=AWS, password=<token>) via the controller identity.
  - apiVersion: generators.external-secrets.io/v1alpha1
    kind: ECRAuthorizationToken
    metadata:
      name: ecr-token
      namespace: argocd
    spec:
      region: ap-southeast-1
  # ExternalSecret: write the ArgoCD repository secret from the generator output; auto-refresh.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: repo-ecr-helm
      namespace: argocd
    spec:
      refreshInterval: 10h
      target:
        name: repo-ecr-helm
        template:
          metadata:
            labels:
              argocd.argoproj.io/secret-type: repository
          data:
            type: helm
            name: ecr-helm
            url: 391511533175.dkr.ecr.ap-southeast-1.amazonaws.com/helm
            enableOCI: "true"
            username: "{{ .username }}"
            password: "{{ .password }}"
      dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: ECRAuthorizationToken
              name: ecr-token
