# Argo CD — GitOps. Bootstrap here, then let an app-of-apps manage the rest.
repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: argocd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    version: "10.9.2"
    wait: true
    values:
      - values.yaml

  # ECR OCI repo secret for ArgoCD, minted + refreshed by External Secrets Operator.
  # Needs the ESO CRDs (01-addons/05-external-secrets) — applied in an earlier layer.
  - name: argocd-ecr-repo
    namespace: argocd
    chart: ../../../../charts/app
    needs:
      - argocd/argocd
    values:
      - ecr-repo-externalsecret.yaml

  # GitLab git repo secret (repo-argo-simple) from Secrets Manager via ESO — replaces the hand-applied
  # kubectl secret. One deploy token for ArgoCD git read + CI tag-commit write.
  - name: argocd-gitlab-repo
    namespace: argocd
    chart: ../../../../charts/app
    needs:
      - argocd/argocd
    values:
      - gitlab-repo-externalsecret.yaml
