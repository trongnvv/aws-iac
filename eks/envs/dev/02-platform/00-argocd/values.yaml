# Expose the Argo CD UI via ALB Ingress (HTTPS-only) + external-dns. TLS = wildcard
# *.trongnv.space (ACM, auto-discovered from the host). The server runs in insecure mode so
# the ALB terminates TLS and talks plain HTTP to argocd-server — the standard ALB + Argo CD
# setup. The gRPC CLI then logs in with `argocd login argocd.trongnv.space --grpc-web`.
global:
  domain: argocd.trongnv.space

configs:
  params:
    server.insecure: true
  # Dev-lab only: fixed admin password so daily teardown/deploy keeps the same login.
  # bcrypt hash of "i1g8pBRn1plfBW2eGvlfwvUh29475he66mezDDkE" (same as the Grafana lab pass). User = admin.
  # ⚠️ Do NOT ship a committed password for prod/shared.
  secret:
    argocdServerAdminPassword: "$2a$10$EQbbA2kwvu/KYItX3cKvUOwcWP0LcS7EGc7sTESMrlvdfKfH.eBO2"
    argocdServerAdminPasswordMtime: "2024-01-01T00:00:00Z"

server:
  ingress:
    enabled: true
    ingressClassName: alb
    hostname: argocd.trongnv.space
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
    path: /
    pathType: Prefix
    tls: false

# Pull the helm/app OCI chart from ECR with NO static creds: the amazon-ecr-credential-helper
# uses the repo-server Pod Identity (role eks-dev-argocd-ecr-read, foundation/04-app-cicd) to
# fetch a registry token on demand. No repo secret, no CronJob refresh.
# ⚠️ verify live: helper version, initContainer image, and that Helm OCI honors credHelpers here.
repoServer:
  serviceAccount:
    create: true
    name: argocd-repo-server # Pod Identity association targets this SA
  initContainers:
    - name: ecr-cred-helper
      image: public.ecr.aws/docker/library/alpine:3.20
      command: [sh, -c]
      args:
        - |
          apk add --no-cache curl >/dev/null
          curl -sLo /custom-tools/docker-credential-ecr-login \
            https://amazon-ecr-credential-helper-releases.s3.us-east-2.amazonaws.com/0.9.1/linux-amd64/docker-credential-ecr-login
          chmod +x /custom-tools/docker-credential-ecr-login
          mkdir -p /custom-tools/docker
          echo '{"credHelpers":{"391511533175.dkr.ecr.ap-southeast-1.amazonaws.com":"ecr-login"}}' > /custom-tools/docker/config.json
      volumeMounts:
        - { name: custom-tools, mountPath: /custom-tools }
  volumes:
    - { name: custom-tools, emptyDir: {} }
  volumeMounts:
    - { name: custom-tools, mountPath: /usr/local/bin/docker-credential-ecr-login, subPath: docker-credential-ecr-login }
    - { name: custom-tools, mountPath: /home/argocd/.docker, subPath: docker }
  env:
    - { name: DOCKER_CONFIG, value: /home/argocd/.docker }
