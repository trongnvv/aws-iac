# Rendered via charts/app (raw). Produces the ArgoCD git repository secret `repo-argo-simple` from
# AWS Secrets Manager (External Secrets Operator, ClusterSecretStore aws-secretsmanager). Replaces
# the hand-applied kubectl secret. The backing secret `prod/gitlab-argo-simple-token` holds a GitLab
# *deploy token* as JSON {"username","password"} (scope read_repository + write_repository). The same
# secret is read by CI (CodeBuild) to commit image tags — one credential for ArgoCD read + CI write.
# Secret name sits under `prod/*` to match the ESO role's allowed path (modules/addon-iam eso_secret_path).
# Requires the External Secrets CRDs + ClusterSecretStore (01-addons/05-external-secrets).
customValues:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: repo-argo-simple
      namespace: argocd
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: aws-secretsmanager
      target:
        name: repo-argo-simple
        template:
          metadata:
            labels:
              argocd.argoproj.io/secret-type: repository
          data:
            type: git
            url: https://gitlab.com/trongnvv-platform/gitops/argo-simple.git
            username: "{{ .username }}"
            password: "{{ .password }}"
      data:
        - secretKey: username
          remoteRef:
            key: prod/gitlab-argo-simple-token
            property: username
        - secretKey: password
          remoteRef:
            key: prod/gitlab-argo-simple-token
            property: password
