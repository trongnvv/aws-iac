# gRPC client release (charts/app). Release name = grpc-client. REST front-end drives
# on-demand gRPC calls; the Ingress exposes it via an ALB (server stays in-cluster).
# `port` drives the container port (8080), the Service (port 80 -> targetPort http), the
# auto HTTP probe (/healthz), and the Ingress backend port. Probes, resources and
# securityContext come from chart defaults.
# Set the ECR account id once:
#   sed -i "s/ACCOUNT_ID/$(aws sts get-caller-identity --query Account --output text)/g" client.yaml
image: "trongnv138/grpc-conn-debug-client:v1"
replicas: 1
# amd64 image -> pin off the arm64 managed node group so Karpenter provisions an
# amd64 node (NodePool is amd64-only). Remove once the image is multi-arch.
nodeSelector:
  kubernetes.io/arch: amd64
port:
  name: http
  number: 8080 # containerPort
  servicePort: 80 # Service + Ingress backend port
  healthPath: /healthz
env:
  # See README "4 cases": flip SERVER_ADDR / LB_POLICY to change the distribution.
  #   Case 2/3: SERVER_ADDR=dns:///grpc-server-headless.grpc-debug.svc.cluster.local:50051
  #   Case 4:   ClusterIP addr + a service mesh (Kuma, 02-platform/05)
  - name: SERVER_ADDR
    value: "grpc-server.grpc-debug.svc.cluster.local:50051"
  - name: LB_POLICY
    value: "round_robin"
  - name: HTTP_ADDR
    value: ":8080"
  - name: LOOP
    value: "false"
  - name: INTERVAL
    value: "3s"
services:
  - name: grpc-client # port omitted -> 80 (servicePort) / targetPort http
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # ALB -> pod IP directly (VPC CNI)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443" # HTTP -> HTTPS
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # No certificate-arn: LBC auto-discovers the ACM cert matching the host
    # (foundation issues the wildcard *.trongnv.space) — keeps values ARN-free.
  rules:
    # external-dns (01-addons/03) creates the Route 53 record for this host -> ALB.
    # This is the model-A path (ALB Ingress / LBC). Gateway API path = -02 (see httpRoute).
    - host: grpc-debug-client-01.trongnv.space
      paths:
        - path: /
          pathType: Prefix
          serviceName: grpc-client
          # servicePort omitted -> from `port` (80)
# --- "-02" path: SAME client, also exposed via ALB Gateway API (in addition to -01 above) ---
# Needs LBC feature gate ALBGatewayAPI + Gateway API CRDs v1.6 (see test-plan 01 §0).
gateway:
  enabled: true
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: internet-facing
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: grpc-debug-client-02.trongnv.space
      tls:
        mode: Terminate
        # LBC ignores certificateRefs/options — the cert comes from the shared gateway-infra
        # LoadBalancerConfiguration (defaultCertificate); this dummy option only passes CRD validation.
        options:
          pass-crd-validation: "true"
      allowedRoutes:
        namespaces:
          from: Same
httpRoute:
  enabled: true
  parentRefs:
    - name: grpc-client        # the Gateway above (= app name)
  hostnames:
    - grpc-debug-client-02.trongnv.space
  rules:
    - backendRefs:
        - name: grpc-client    # reuse this release's Service
          port: 80
# GatewayClass "alb" + LoadBalancerConfiguration "internet-facing" (referenced above) are
# SHARED infra — defined once in the `gateway-infra` release (gateway-infra.yaml), reused by
# the server and any other app that exposes via the ALB Gateway API.
