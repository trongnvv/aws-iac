# gRPC client: REST front-end that drives on-demand gRPC calls to the in-cluster server.
# Probes/resources/securityContext = chart defaults.
image: "trongnv138/grpc-conn-debug-client:v1"
replicas: 1
# amd64-only image → pin off the arm64 managed node group so Karpenter gives it an amd64 node.
nodeSelector:
  kubernetes.io/arch: amd64
port:
  name: http
  number: 8080
  servicePort: 80
  healthPath: /healthz
env:
  # 4 cases of gRPC LB (see README): flip SERVER_ADDR / LB_POLICY to change the distribution.
  # headless + round_robin spreads across pods; ClusterIP pins to one backend.
  - name: SERVER_ADDR
    value: "grpc-server.grpc-debug.svc.cluster.local:50051"
  - name: LB_POLICY
    value: "round_robin"
  - name: HTTP_ADDR
    value: ":8080"
  - name: LOOP
    value: "false"
  - name: INTERVAL
    value: "3s"
services:
  - name: grpc-client

# -01 — classic ALB Ingress
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # no certificate-arn: Ingress auto-discovers the *.trongnv.space ACM cert by host
  rules:
    - host: grpc-debug-client-01.trongnv.space
      paths:
        - path: /
          pathType: Prefix
          serviceName: grpc-client

# -02 — same client, via ALB Gateway API (HTTPRoute). GatewayClass + LoadBalancerConfiguration
# are shared infra (see gateway-infra.yaml).
gateway:
  enabled: true
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: internet-facing
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: grpc-debug-client-02.trongnv.space
      tls:
        mode: Terminate
        options:
          pass-crd-validation: "true"   # dummy; satisfies the CRD. Real cert is in gateway-infra's LoadBalancerConfiguration.
      allowedRoutes:
        namespaces:
          from: Same
httpRoute:
  enabled: true
  parentRefs:
    - name: grpc-client
  hostnames:
    - grpc-debug-client-02.trongnv.space
  rules:
    - backendRefs:
        - name: grpc-client
          port: 80

# Gateway API defaults to `instance` targets; our Service is ClusterIP → force ip.
targetGroupConfiguration:
  enabled: true
  targetType: ip
