# Shared ALB Gateway API infra for the DEV namespace — GatewayClass (cluster-scoped) +
# LoadBalancerConfiguration, referenced by the dev -02 gateways. Only dev uses Gateway API;
# stg/prod are ingress-only. Rendered raw via charts/app customValues (no image → no Deployment).
customValues:
  # Cluster-scoped GatewayClass — one per cluster.
  - apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    metadata:
      name: alb
    spec:
      controllerName: gateway.k8s.aws/alb

  # LBC ALB attributes for ns dev — Gateways reference it via infrastructure.parametersRef.
  - apiVersion: gateway.k8s.aws/v1
    kind: LoadBalancerConfiguration
    metadata:
      name: internet-facing
      namespace: dev
    spec:
      scheme: internet-facing
      # LBC sets the ALB HTTPS cert HERE (the Gateway listener's certificateRefs is ignored).
      listenerConfigurations:
        - protocolPort: HTTPS:443
          defaultCertificate: arn:aws:acm:ap-southeast-1:391511533175:certificate/6a5d4660-80d3-4b6c-9a8a-ea7d97d7a9cb
