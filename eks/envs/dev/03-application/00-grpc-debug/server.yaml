# gRPC server: 3 replicas so you can watch which backend the client's single long-lived
# connection lands on (the gRPC-on-L4 LB gotcha). Probes/resources/securityContext = chart defaults.
image: "trongnv138/grpc-conn-debug-server:v1"
replicas: 3
# amd64-only image → pin off the arm64 managed node group so Karpenter gives it an amd64 node.
nodeSelector:
  kubernetes.io/arch: amd64
port:
  name: grpc
  number: 50051
  appProtocol: grpc       # → gRPC probe + Service appProtocol=grpc
env:
  - name: LISTEN_ADDR
    value: ":50051"
  - name: POD_IP          # downward API: report the real pod IP so the client sees which backend answered
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
services:
  - name: grpc-server              # ClusterIP — L4 pins gRPC's single HTTP/2 conn to one backend
  - name: grpc-server-headless     # headless — DNS returns all pod IPs (use with client round_robin)
    clusterIP: None

# Two front doors to the same server (mirrors the client): -01 classic Ingress, -02 Gateway API.
# Both HTTPS (ALB gRPC needs ALPN h2).

# -01 — classic ALB Ingress
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol-version: GRPC
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # no certificate-arn: Ingress auto-discovers the *.trongnv.space ACM cert by host
  rules:
    - host: grpc-debug-server-01.trongnv.space
      paths:
        - path: /
          pathType: Prefix
          serviceName: grpc-server
          servicePort: 50051

# -02 — ALB Gateway API GRPCRoute (reuses the shared gateway-infra)
gateway:
  enabled: true
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: internet-facing
  listeners:
    - name: grpc
      protocol: HTTPS
      port: 443
      hostname: grpc-debug-server-02.trongnv.space
      tls:
        mode: Terminate
        options:
          # dummy — satisfies the CRD ("Terminate needs certificateRefs or options"); LBC
          # ignores it, the real cert is gateway-infra's LoadBalancerConfiguration.defaultCertificate.
          pass-crd-validation: "true"
      allowedRoutes:
        namespaces:
          from: Same
grpcRoute:
  enabled: true
  parentRefs:
    - name: grpc-server
  hostnames:
    - grpc-debug-server-02.trongnv.space
  rules:
    - backendRefs:
        - name: grpc-server
          port: 50051

# Gateway API defaults to `instance` targets (needs NodePort/LB); our Service is ClusterIP → force ip.
targetGroupConfiguration:
  enabled: true
  targetType: ip
  protocolVersion: GRPC
