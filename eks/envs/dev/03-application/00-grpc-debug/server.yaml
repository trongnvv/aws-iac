# gRPC server release (charts/app). Release name = grpc-server -> pods/Services get
# label app.kubernetes.io/name=grpc-server. 3 replicas so you can watch which backend
# the client's single long-lived connection lands on.
# `port` (name/number/appProtocol) drives the container port, both Services' ports, and
# the auto gRPC health probe. Probes, resources and securityContext come from chart defaults.
# Set the ECR account id once:
#   sed -i "s/ACCOUNT_ID/$(aws sts get-caller-identity --query Account --output text)/g" server.yaml
image: "trongnv138/grpc-conn-debug-server:v1"
replicas: 3
# amd64 image -> pin off the arm64 managed node group so Karpenter provisions an
# amd64 node (NodePool is amd64-only). Remove once the image is multi-arch.
nodeSelector:
  kubernetes.io/arch: amd64
port:
  name: grpc
  number: 50051
  appProtocol: grpc # -> gRPC probe + Service appProtocol=grpc
env:
  - name: LISTEN_ADDR
    value: ":50051"
  # Downward API: report the real pod IP so the client log tells apart the ClusterIP
  # VIP from the actual backend it landed on.
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
services:
  # ClusterIP — one virtual IP; L4 pins gRPC's single HTTP/2 conn to one backend.
  # port omitted -> derived from `port` (50051 / targetPort grpc / appProtocol grpc).
  - name: grpc-server
  # Headless — DNS returns every pod IP; use with client LB_POLICY=round_robin.
  - name: grpc-server-headless
    clusterIP: None

# Optional — expose gRPC externally via ALB Gateway API (LBC). The ALB routes gRPC at
# L7 (GRPCRoute) → per-RPC load-balance across all 3 backends (the "case 4" fix) instead
# of the L4 ClusterIP pin. Prereqs: LBC feature gate ALBGatewayAPI on, Gateway API CRDs
# v1.6, and a GatewayClass "alb" (controllerName gateway.k8s.aws/alb). Then:
# gateway:
#   enabled: true
#   gatewayClassName: alb
#   listeners:
#     - name: grpc
#       protocol: HTTP
#       port: 50051
#       allowedRoutes: {namespaces: {from: Same}}
# grpcRoute:
#   enabled: true
#   parentRefs:
#     - {name: grpc-server}   # the Gateway above
#   # servicePort omitted -> from `port` (50051)
