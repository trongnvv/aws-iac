# grpc-debug: the app (server + client) is deployed via ArgoCD GitOps now
# (gitlab trongnvv-platform/gitops/argo-simple → apps/grpc-conn-debug/*). Only the shared
# gateway-infra stays here in IaC — GatewayClass is cluster-scoped platform infra, not app
# workload, and the ArgoCD -02 gateways reference its LoadBalancerConfiguration by name.
# server.yaml / client.yaml are kept as reference (live values are in the gitops repo).
releases:
  # Shared ALB Gateway API infra (GatewayClass + LoadBalancerConfiguration) for ns grpc-debug.
  - name: gateway-infra
    namespace: grpc-debug
    createNamespace: true
    chart: ../../../../charts/app
    values:
      - gateway-infra.yaml

