# grpc-debug app (server + client) is deployed via ArgoCD across 3 namespaces (dev/stg/prod) —
# gitlab trongnvv-platform/gitops/argo-simple → apps/grpc-conn-debug/ (ApplicationSets + ImageUpdater).
# Only DEV uses Gateway API (-02), so the shared gateway-infra (GatewayClass + LoadBalancerConfiguration
# in ns dev) stays here in IaC. stg/prod are ingress-only. server.yaml/client.yaml kept as reference.
releases:
  - name: gateway-infra
    namespace: dev
    createNamespace: true
    chart: ../../../../charts/app
    values:
      - gateway-infra.yaml

