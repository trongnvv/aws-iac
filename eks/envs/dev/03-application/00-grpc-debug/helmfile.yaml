# gRPC connection load-balancing lab — 3 releases (server · client · shared gateway-infra) off
# charts/app. Needs the AWS Load Balancer Controller (01-addons/02). See README.md.
releases:
  - name: grpc-server
    namespace: grpc-debug
    createNamespace: true
    chart: ../../../../charts/app
    needs:
      - grpc-debug/gateway-infra   # GatewayClass + LoadBalancerConfiguration for the server's GRPCRoute
    values:
      - server.yaml

  # Shared ALB Gateway API infra (GatewayClass + LoadBalancerConfiguration) — reused by the
  # client -02 route and the server; separate so apps don't each re-declare it.
  - name: gateway-infra
    namespace: grpc-debug
    createNamespace: true
    chart: ../../../../charts/app
    values:
      - gateway-infra.yaml

  - name: grpc-client
    namespace: grpc-debug
    createNamespace: true
    chart: ../../../../charts/app
    needs:
      - grpc-debug/grpc-server
      - grpc-debug/gateway-infra
    values:
      - client.yaml
