# Rendered via the shared ../../../../charts/app chart (raw customValues manifests).
# Declare constraints, not instances — Karpenter solves the bin-packing.
customValues:
  - apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: default
    spec:
      template:
        spec:
          requirements:
            # amd64-only: the grpc-debug images on Docker Hub are amd64 (not multi-arch).
            # Trade-off: loses Graviton (~20% cheaper). Switch back to ["amd64","arm64"]
            # once images are multi-arch.
            - key: kubernetes.io/arch
              operator: In
              values: ["amd64"]
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["spot", "on-demand"]
            # t-family included: burstable (t3/t3a) is cheapest for the idle/bursty lab
            # workload. Drop "t" for steady high-CPU load (credits throttle then).
            - key: karpenter.k8s.aws/instance-category
              operator: In
              values: ["t", "c", "m", "r"]
          nodeClassRef:
            group: karpenter.k8s.aws
            kind: EC2NodeClass
            name: default
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 30s
      limits:
        cpu: "1000"

  - apiVersion: karpenter.k8s.aws/v1
    kind: EC2NodeClass
    metadata:
      name: default
    spec:
      amiFamily: AL2023
      amiSelectorTerms:
        - alias: al2023@latest
      role: "Karpenter-eks-dev"
      subnetSelectorTerms:
        - tags:
            karpenter.sh/discovery: "eks-dev"
      securityGroupSelectorTerms:
        - tags:
            karpenter.sh/discovery: "eks-dev"
      # Karpenter defaults hopLimit=1, which blocks PODS from reaching IMDS — the LBC then
      # can't auto-discover the VPC id and crashes ("failed to get VPC ID ... ec2imds ...").
      # hopLimit=2 lets pods reach IMDS; IMDSv2 (httpTokens=required) is kept for security.
      metadataOptions:
        httpEndpoint: enabled
        httpTokens: required
        httpPutResponseHopLimit: 2
