# Rendered via the shared ../../../../charts/app chart (raw customValues manifests).
# Declare constraints, not instances — Karpenter solves the bin-packing.
customValues:
  - apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: default
    spec:
      template:
        spec:
          requirements:
            - key: kubernetes.io/arch
              operator: In
              values: ["amd64", "arm64"]
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["spot", "on-demand"]
            - key: karpenter.k8s.aws/instance-category
              operator: In
              values: ["c", "m", "r"]
          nodeClassRef:
            group: karpenter.k8s.aws
            kind: EC2NodeClass
            name: default
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 30s
      limits:
        cpu: "1000"

  - apiVersion: karpenter.k8s.aws/v1
    kind: EC2NodeClass
    metadata:
      name: default
    spec:
      amiFamily: AL2023
      amiSelectorTerms:
        - alias: al2023@latest
      role: "Karpenter-eks-dev"
      subnetSelectorTerms:
        - tags:
            karpenter.sh/discovery: "eks-dev"
      securityGroupSelectorTerms:
        - tags:
            karpenter.sh/discovery: "eks-dev"
