# vpcId omitted on purpose — the controller auto-discovers it from the node's
# IMDS, so no Terraform output wiring is needed.
clusterName: eks-dev
region: ap-southeast-1
serviceAccount:
  create: true
  name: aws-load-balancer-controller
# Enable the ALB Gateway API controller (GatewayClass controllerName gateway.k8s.aws/alb).
# NOTE: featureGates lives under controllerConfig (NOT top-level) — renders --feature-gates.
# Needs the Gateway API CRDs + LBC gateway CRDs installed — see
# docs/hands-on/test-plans/01-TEST-INGRESS-GATEWAY-API.md §0.
controllerConfig:
  featureGates:
    ALBGatewayAPI: true
