# Kuma — service mesh (mTLS between services, traffic management, telemetry).
# Open-source (CNCF). East-west only (mesh mTLS) — north-south
# ingress / API gateway is the ALB via LBC (Ingress + Gateway API); the two never overlap.
repositories:
  - name: kuma
    url: https://kumahq.github.io/charts

releases:
  - name: kuma
    namespace: kuma-system
    createNamespace: true
    chart: kuma/kuma
    version: "2.14.5"
    wait: true
