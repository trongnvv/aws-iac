# External Secrets Operator + a ClusterSecretStore for AWS Secrets Manager.
# IAM via Pod Identity from 00-infra/03-addon-iam (SA external-secrets).
repositories:
  - name: external-secrets
    url: https://charts.external-secrets.io

releases:
  - name: external-secrets
    namespace: external-secrets
    createNamespace: true
    chart: external-secrets/external-secrets
    version: "2.11.0"
    wait: true
    values:
      - serviceAccount:
          create: true
          name: external-secrets

  # ClusterSecretStore, rendered via the shared charts/app raw-manifest chart.
  - name: external-secrets-store
    namespace: external-secrets
    chart: ../../../../charts/app
    needs:
      - external-secrets/external-secrets
    values:
      - secretstore.yaml
