# Istio — service mesh (mTLS between services, traffic management, telemetry).
repositories:
  - name: istio
    url: https://istio-release.storage.googleapis.com/charts

releases:
  - name: istio-base
    namespace: istio-system
    createNamespace: true
    chart: istio/base
    version: "1.24.1"
    wait: true

  - name: istiod
    namespace: istio-system
    chart: istio/istiod
    version: "1.24.1"
    wait: true
    needs:
      - istio-system/istio-base
