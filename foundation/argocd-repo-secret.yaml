# ArgoCD repository credential — enables GitOps for the gitops repo (argo-simple).
# One GitLab Project Access Token (scope write_repository, role Maintainer on argo-simple):
#   ArgoCD reads the values source + Image Updater commits the tag back — same token.
#
# The OCI chart repo (repo-ecr-helm) is NOT here — ESO mints it (02-platform/00-argocd).
#
# Apply (fill the token first; do NOT commit the real value):
#   kubectl apply -f argocd-repo-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: repo-argo-simple
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://gitlab.com/trongnvv-platform/gitops/argo-simple.git
  username: gitlab+deploy-token-xxx
  password: gldt-Mq1T5K3_Jzo-xxx # write_repository PAT on argo-simple — do NOT commit the real value
